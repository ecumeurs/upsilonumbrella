services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    init: true
    depends_on:
      - db
    volumes:
      - .:/workspace
      - $HOME/.ssh:/home/vscode/.ssh:cached
      - $HOME/.local:/home/vscode/.local:cached
      - $HOME/.antigravity/extensions/local-dev.atd-linker:/home/vscode/extensions/local-dev.atd-linker:cached
      - $HOME/.gemini:/home/vscode/.gemini:cached
      - $HOME/.claude:/home/vscode/.claude
      - $HOME/.claude.json:/home/vscode/.claude.json:cached
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      # Dev-topology internal URLs: all five app-level processes share this
      # container's network namespace, so they are localhost-based here (unlike
      # the CI compose, where each service is its own container on service-DNS).
      # Declared once at compose level so every process (including a manual/
      # ad-hoc run outside start_services.sh) inherits the same wiring — see
      # scripts/start_services.sh, which falls back to these same values.
      - ECONOMY_INTERNAL_URL=http://localhost:8092
      - HUB_INTERNAL_URL=http://localhost:8090
      - AUTH_INTERNAL_URL=http://localhost:8091
      - UPSILON_API_URL=http://localhost:8081
      - S2S_TOKEN=dev-internal-token
      # Canonical front door (Caddy): the only entry point that routes both
      # /api/v1/auth/* (to upsilonauth) and everything else (to the hub).
      # `proxy` is the compose service name, resolvable from this `app`
      # container — callers (e.g. upsiloncli) simply inherit this.
      - UPSILON_BASE_URL=http://proxy:8085
    ports:
      - "5173:5173"
      - "8081:8081"
      - "8090:8090"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ollama_network

  proxy:
    # Stable front door (:8085) → the hub (:8090 inside the app devcontainer),
    # which serves the API, SSE and the SPA since the Phase 6 cutover.
    image: caddy:2-alpine
    depends_on:
      - app
    volumes:
      - ./upsilonhub/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8085:8085"
    networks:
      - ollama_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./upsilonhub/deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - ollama_network

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - laravel_db_data:/var/lib/postgresql
      # Per-service databases (upsilon, upsilonauth, upsiloneconomy) — only runs on a
      # fresh volume; `docker compose down -v` to reprovision an existing dev database.
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - ollama_network

volumes:
  laravel_db_data:

networks:
  ollama_network:
    # Use 'external: true' if you created the network manually via the CLI first
    external: true
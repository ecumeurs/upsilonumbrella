# docker-compose.ci.yaml — Ephemeral CI Stack
# Optimized for speed (tmpfs), reliability (healthchecks), and determinism.
# Usage: docker compose -f docker-compose.ci.yaml up -d --wait
#
# Post-cutover shape (Phase 6 §E): the hub owns migrations, seeding, the API,
# SSE and the SPA. Caddy is the front door on :8085 — its healthcheck doubles
# as the hub's (the distroless hub image has no shell for an in-container one).

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: upsilon
    volumes:
      # Per-service databases (upsilon, upsilonauth, upsiloneconomy); CI stacks are
      # always fresh, so the initdb scripts run on every `up`.
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  hub-migrate:
    build:
      context: .
      dockerfile: ./upsilonhub/Dockerfile
    command: [ "-migrate-mode", "full" ]
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsilon?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  hub-seed:
    build:
      context: .
      dockerfile: ./upsilonhub/Dockerfile
    command: [ "-seed" ]
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsilon?sslmode=disable
    env_file:
      - .env # ADMIN_INITIAL_PASSWORD gates the admin seed block
    depends_on:
      hub-migrate:
        condition: service_completed_successfully

  hub:
    build:
      context: .
      dockerfile: ./upsilonhub/Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsilon?sslmode=disable
      # Exception-prefix parity ("-- DEBUG MODE -- ") — the CLI edge suites
      # assert it, matching Laravel's testing env.
      - APP_DEBUG=true
      - UPSILON_API_URL=http://engine:8081
      - UPSILON_WEBHOOK_URL=http://proxy:8085/api/webhook/upsilon
      # Phase-3 economy swap: wallet reads, purchases and the award worker go
      # to the extracted upsiloneconomy service over the internal S2S surface.
      # (Empty ECONOMY_INTERNAL_URL would keep the in-process rollback impl.)
      - ECONOMY_INTERNAL_URL=http://economy:8092
      # Phase-4 auth cutover: token introspection goes to the extracted
      # upsilonauth service. Hard cutover — no rollback flag (unlike economy).
      - AUTH_INTERNAL_URL=http://auth:8091
      - S2S_TOKEN=ci-internal-token
    depends_on:
      hub-seed:
        condition: service_completed_successfully
      economy:
        condition: service_healthy
      auth:
        condition: service_healthy

  # --- upsilonauth (:8091) — Phase-4 cutover: Caddy routes /api/v1/auth/* and
  # /api/v1/admin/users* straight here; the hub reaches it over S2S for
  # introspection and receives its AccountPush jobs on /internal/v1. ---------
  auth-migrate:
    build:
      context: .
      dockerfile: ./upsilonauth/Dockerfile
    command: [ "-migrate" ]
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsilonauth?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  auth-seed:
    build:
      context: .
      dockerfile: ./upsilonauth/Dockerfile
    command: [ "-seed" ]
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsilonauth?sslmode=disable
    env_file:
      - .env # ADMIN_INITIAL_PASSWORD gates the admin seed block
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  auth:
    build:
      context: .
      dockerfile: ./upsilonauth/Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsilonauth?sslmode=disable
      - APP_DEBUG=true
      # AccountPush producer (River job -> POST /internal/v1/players/:id/account)
      # needs the hub's internal S2S surface to relay account lifecycle mutations.
      - HUB_INTERNAL_URL=http://hub:8090
      # GDPR export collector fans out to economy over S2S; without it the
      # collector fail-closes (export returns 503) — same seam the hub uses.
      - ECONOMY_INTERNAL_URL=http://economy:8092
      - S2S_TOKEN=ci-internal-token
    depends_on:
      auth-seed:
        condition: service_completed_successfully
      economy:
        condition: service_healthy
    healthcheck:
      # Distroless image (no shell): the binary probes its own /up route.
      test: [ "CMD", "/app/upsilonauth", "-healthcheck" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- upsiloneconomy (:8092) — internal-only, dark until the Phase-3 swap ---
  economy-migrate:
    build:
      context: .
      dockerfile: ./upsiloneconomy/Dockerfile
    command: [ "-migrate" ]
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsiloneconomy?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  economy-seed:
    build:
      context: .
      dockerfile: ./upsiloneconomy/Dockerfile
    command: [ "-seed" ]
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsiloneconomy?sslmode=disable
    depends_on:
      economy-migrate:
        condition: service_completed_successfully

  economy:
    build:
      context: .
      dockerfile: ./upsiloneconomy/Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsiloneconomy?sslmode=disable
      - APP_DEBUG=true
      - S2S_TOKEN=ci-internal-token
    depends_on:
      economy-seed:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "/app/upsiloneconomy", "-healthcheck" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  proxy:
    image: caddy:2-alpine
    environment:
      - HUB_UPSTREAM=hub:8090
      # Phase-4 auth cutover: /api/v1/auth/* and /api/v1/admin/users* go here.
      - AUTH_UPSTREAM=auth:8091
    volumes:
      - ./upsilonhub/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8085:8085"
    depends_on:
      hub:
        condition: service_started
      auth:
        condition: service_healthy
    healthcheck:
      # Proves the whole chain: proxy → hub → /up liveness route.
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8085/up" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  engine:
    build:
      context: .
      dockerfile: ./upsilonapi/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  tester:
    build:
      context: .
      dockerfile: ./upsiloncli/Dockerfile
    environment:
      - UPSILON_BASE_URL=http://proxy:8085
      - UPSILON_CLI_PATH=upsiloncli
    volumes:
      - ./upsiloncli/samples:/app/upsiloncli/samples
      - ./upsiloncli/tests:/app/upsiloncli/tests
      - ./upsiloncli/internal:/app/upsiloncli/internal
    depends_on:
      proxy:
        condition: service_healthy
      engine:
        condition: service_healthy

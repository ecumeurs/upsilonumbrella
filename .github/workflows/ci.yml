# @lint-ignore-atd tooling workflow with no business-layer rationale (CODING_RULE.md §6).
name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ============================================================================
  # STAGE 1: Build & Lint
  # ============================================================================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # The submodules are separate PRIVATE repos; the default GITHUB_TOKEN
          # can't read sibling repos, so cloning them needs a token with
          # org-wide `contents: read`. Falls back to the default token when the
          # secret is unset (main repo still checks out; submodules won't).
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.work

      - name: Sync Workspace
        run: go work sync

      - name: Verify Sync Left Tree Clean
        # ISS-134: `go work sync` silently rewrites each member module's own
        # go.mod/go.sum to match the workspace's resolved versions. If the
        # committed manifests already matched, this step is a no-op; if they
        # drifted, it means someone changed a dependency without re-running
        # `go work sync` and committing the result. The umbrella repo is a
        # submodule checkout — a bare `git diff` at its root does not see
        # into submodule working trees, so both scopes are checked.
        run: |
          if ! git diff --exit-code -- go.work go.work.sum; then
            echo "::error::go work sync modified the umbrella's go.work/go.work.sum. Run 'go work sync' locally and commit the reconciled files."
            exit 1
          fi
          dirty="$(git submodule foreach --quiet 'git diff --quiet -- go.mod go.sum || echo "$name"')"
          if [ -n "$dirty" ]; then
            echo "::error::go work sync left uncommitted go.mod/go.sum drift in: $dirty. Run 'go work sync' locally, review the diff in each affected submodule, and commit the reconciled go.mod/go.sum there."
            exit 1
          fi

      - name: Go Vet (Modules Derived From go.work)
        # Module list is derived from go.work (see scripts/list_go_modules.sh)
        # instead of hand-maintained here — this list drifted twice when
        # services were extracted from the hub (ISS-123, ISS-132).
        run: go vet $(scripts/list_go_modules.sh)

      - name: Build Upsilon API
        run: go build -o /dev/null ./upsilonapi

      - name: Build Upsilon CLI
        run: go build -o /dev/null ./upsiloncli/cmd/upsiloncli

      - name: Build Upsilon Hub
        run: go build -o /dev/null ./upsilonhub/cmd/upsilonhub

      - name: Build Upsilon Auth
        run: go build -o /dev/null ./upsilonauth/cmd/upsilonauth

      - name: Build Upsilon Economy
        run: go build -o /dev/null ./upsiloneconomy/cmd/upsiloneconomy

      - name: Verify Dockerfiles
        run: |
          echo "Checking upsilonhub Dockerfile..."
          docker build --check -f upsilonhub/Dockerfile . 2>/dev/null || echo "Docker --check not supported, skipping syntax validation"
          echo "Checking upsilonapi Dockerfile..."
          docker build --check -f upsilonapi/Dockerfile . 2>/dev/null || echo "Docker --check not supported, skipping syntax validation"
          echo "Checking upsilonauth Dockerfile..."
          docker build --check -f upsilonauth/Dockerfile . 2>/dev/null || echo "Docker --check not supported, skipping syntax validation"
          echo "Checking upsiloneconomy Dockerfile..."
          docker build --check -f upsiloneconomy/Dockerfile . 2>/dev/null || echo "Docker --check not supported, skipping syntax validation"

      - name: Generate Build Report
        if: always()
        run: |
          chmod +x ./tests/lint_report.sh
          ./tests/lint_report.sh > build_report.md
          cat build_report.md >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STAGE 2: Unit Tests (depends on build)
  # ============================================================================
  go-tests:
    name: Go Unit Tests
    needs: build
    runs-on: ubuntu-latest
    env:
      # The gateway suite shares one Postgres testcontainer across ~140 tests;
      # on ephemeral CI runners the testcontainers Ryuk reaper can collect it
      # mid-run (later tests then see "connection refused/reset"). The runner VM
      # is destroyed after the job, so container cleanup is moot — disable Ryuk.
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # The submodules are separate PRIVATE repos; the default GITHUB_TOKEN
          # can't read sibling repos, so cloning them needs a token with
          # org-wide `contents: read`. Falls back to the default token when the
          # secret is unset (main repo still checks out; submodules won't).
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.work

      - name: Sync Workspace
        run: go work sync

      - name: Verify Sync Left Tree Clean
        # ISS-134: see the identical guard in the build job. Duplicated here
        # (rather than shared) because this job runs in its own fresh
        # checkout and go-tests must not silently run against drifted
        # manifests either.
        run: |
          if ! git diff --exit-code -- go.work go.work.sum; then
            echo "::error::go work sync modified the umbrella's go.work/go.work.sum. Run 'go work sync' locally and commit the reconciled files."
            exit 1
          fi
          dirty="$(git submodule foreach --quiet 'git diff --quiet -- go.mod go.sum || echo "$name"')"
          if [ -n "$dirty" ]; then
            echo "::error::go work sync left uncommitted go.mod/go.sum drift in: $dirty. Run 'go work sync' locally, review the diff in each affected submodule, and commit the reconciled go.mod/go.sum there."
            exit 1
          fi

      - name: Run Go Tests (Modules Derived From go.work)
        # Module list is derived from go.work (see scripts/list_go_modules.sh)
        # instead of hand-maintained here — this list drifted twice when
        # services were extracted from the hub (ISS-123, ISS-132), leaving 17
        # upsilonauth/upsiloneconomy test files never executed by any `go
        # test` invocation in the pipeline.
        #
        # Run in two invocations, not one: upsilonauth and upsiloneconomy
        # each start several testcontainers Postgres instances
        # (accountpush/gateway/identity/seed and api/economy respectively),
        # joining upsilonhub's own two (gateway, seed) for 8 container-backed
        # packages total — a 4x jump from the 2 CI already tolerates today.
        # At default parallelism this measured as 6 flaky `unexpected EOF` /
        # `failed to receive message` container-contention failures with no
        # underlying logic regression; forcing just these two modules to
        # `-p 1` serializes their container starts and measured green on 3
        # consecutive runs (~30s total vs ~13s unconstrained) — far cheaper
        # than forcing all 12 modules to `-p 1` (measured ~52-56s). 600s
        # timeout: the hub feature tests boot throwaway Postgres containers
        # (testcontainers) — the first image pull eats into the timeout.
        run: |
          go test -count=1 -timeout 600s -json $(scripts/list_go_modules.sh --exclude upsilonauth,upsiloneconomy) > go-test-results.json 2>&1 || true
          go test -count=1 -timeout 600s -json -p 1 $(scripts/list_go_modules.sh --only upsilonauth,upsiloneconomy) >> go-test-results.json 2>&1 || true

      - name: Check for Failures
        run: |
          if grep -q '"Action":"fail"' go-test-results.json; then
            echo "::error::Go tests failed"
            grep '"Action":"fail"' go-test-results.json | head -20
            exit 1
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-results
          path: go-test-results.json
          retention-days: 3

  unit-test-summary:
    name: Unit Test Summary
    needs: [go-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download Go Results
        uses: actions/download-artifact@v8
        with:
          name: go-test-results
          path: .

      - name: Generate Unit Report
        run: |
          chmod +x ./tests/unit_report.sh
          ./tests/unit_report.sh > summary.md
          cat summary.md >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STAGE 3: Integration & E2E Tests (depend on unit tests)
  # These run in parallel after unit tests pass
  # ============================================================================
  integration-tests:
    name: Integration & E2E Tests
    needs: unit-test-summary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # The submodules are separate PRIVATE repos; the default GITHUB_TOKEN
          # can't read sibling repos, so cloning them needs a token with
          # org-wide `contents: read`. Falls back to the default token when the
          # secret is unset (main repo still checks out; submodules won't).
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Prepare Environment
        run: |
          cp .env.ci .env
          mkdir -p upsiloncli/tests/logs

      # The stack now builds 6 images (hub+SPA, engine, cli, auth, economy);
      # a stock runner's ~14GB free disk is not enough. Dropping the unused
      # preinstalled toolchains reclaims ~25GB.
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af > /dev/null
          df -h / | tail -1

      # NOTE: Playwright (browser E2E from upsilonbattleui) is temporarily
      # excluded from CI — it used to run from the dev environment and is a
      # later item to re-wire (GPU-less runner / ISS-100 visual specs, ISS-104
      # parallel-join race). The upsiloncli scenario + edge suites below remain
      # the CI E2E gate. To restore: re-add the Node.js setup, `npm ci`,
      # `npx playwright install --with-deps chromium`, and the Playwright run
      # step (`--workers=1`), plus the playwright-report artifact path.

      - name: Boot Upsilon Services (Built Once)
        run: docker compose -f docker-compose.ci.yaml up -d --wait --wait-timeout 300

      - name: Show Service Status
        run: docker compose -f docker-compose.ci.yaml ps

      - name: "E2E: Run Centralized Customer Scenarios"
        continue-on-error: true
        run: |
          docker compose -f docker-compose.ci.yaml exec -T tester /bin/sh ./tests/run_all_scenarios.sh

      - name: "E2E: Run Edge Case Suite"
        # GATING as of the ISS-107 audit close (2026-07-12): all 55 scenarios
        # were audited and corrected, so a red here is now a real regression and
        # fails the build. The handful of still-open KNOWN issues (ISS-108/110
        # flakes, ISS-116 intentional-red) are quarantined inside
        # run_all_edge_cases.sh — they still run and report, but don't gate,
        # until their issues are fixed. See ci_edge_case_reporting.md.
        run: |
          docker compose -f docker-compose.ci.yaml exec -T tester /bin/sh ./tests/run_all_edge_cases.sh

      - name: Generate Combined Reports
        if: always()
        run: |
          ./tests/ci_report.sh > ci_report.md 2>&1 || true
          cat ci_report.md >> $GITHUB_STEP_SUMMARY
          
          if ls upsiloncli/tests/logs/edge_*.log >/dev/null 2>&1; then
            ./tests/edge_case_report.sh > edge_case_report.md 2>&1 || true
            cat edge_case_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Collect Docker Logs on Failure
        if: failure()
        run: |
          mkdir -p ci_logs
          docker compose -f docker-compose.ci.yaml logs hub-migrate hub-seed > ci_logs/hub-init.log 2>&1
          docker compose -f docker-compose.ci.yaml logs hub > ci_logs/hub.log 2>&1
          docker compose -f docker-compose.ci.yaml logs proxy > ci_logs/proxy.log 2>&1
          docker compose -f docker-compose.ci.yaml logs engine > ci_logs/engine.log 2>&1
          docker compose -f docker-compose.ci.yaml logs db > ci_logs/db.log 2>&1
          docker compose -f docker-compose.ci.yaml logs tester > ci_logs/tester.log 2>&1
          docker compose -f docker-compose.ci.yaml logs auth-migrate auth-seed > ci_logs/auth-init.log 2>&1
          docker compose -f docker-compose.ci.yaml logs auth > ci_logs/auth.log 2>&1
          docker compose -f docker-compose.ci.yaml logs economy-migrate economy-seed > ci_logs/economy-init.log 2>&1
          docker compose -f docker-compose.ci.yaml logs economy > ci_logs/economy.log 2>&1

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            ci_report.md
            edge_case_report.md
            ci_logs/
            upsiloncli/tests/logs/
          retention-days: 3

      - name: Teardown Docker Stack
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v
